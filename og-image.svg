<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F6B"/>
      <stop offset="50%" stop-color="#003AAD"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ogSpineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00C7BE"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Left Card: Spine 7-Vertebrae Icon -->
  <g filter="url(#shadow)">
    <rect x="100" y="155" width="320" height="320" rx="72" fill="url(#cardGrad)"/>
    <rect x="102" y="157" width="316" height="316" rx="70" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
      <rect x="243.1" y="203.8" width="41.6" height="14.3" rx="7.2" fill="url(#ogSpineGrad)" />
      <rect x="244.4" y="238.3" width="46.8" height="15.6" rx="7.8" fill="url(#ogSpineGrad)" />
      <rect x="230.1" y="272.8" width="54.6" height="16.9" rx="8.5" fill="url(#ogSpineGrad)" />
      <rect x="218.4" y="305.9" width="59.8" height="18.2" rx="9.1" fill="url(#ogSpineGrad)" />
      <rect x="226.2" y="339.7" width="59.8" height="18.2" rx="9.1" fill="url(#ogSpineGrad)" />
      <rect x="237.9" y="374.8" width="57.2" height="18.2" rx="9.1" fill="url(#ogSpineGrad)" />
      <rect x="234.0" y="411.2" width="44.2" height="15.6" rx="7.8" fill="url(#ogSpineGrad)" />
  </g>

  <!-- Right Typography -->
  <text x="480" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">
    臺灣物理治療實證助手
  </text>
  <text x="480" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="25" font-weight="600" fill="rgba(255,255,255,0.85)" letter-spacing="0.01em">
    國際醫學實證 · 動作控制 · 分期運動指引
  </text>

  <g transform="translate(480, 365)">
    <rect width="210" height="48" rx="24" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <text x="105" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      臨床實證指引
    </text>

    <rect x="225" width="220" height="48" rx="24" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <text x="335" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      運動訓練衛教
    </text>
  </g>

  <text x="480" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="20" font-weight="500" fill="rgba(255,255,255,0.72)">
    taiwan-pt-web.vercel.app
  </text>
</svg>
