<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00B8B0"/>
      <stop offset="100%" stop-color="#006FE6"/>
    </linearGradient>
    <style>
      .bg-squircle {
        fill: #FFFFFF;
        stroke: rgba(0, 0, 0, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        .bg-squircle {
          fill: #0F172A;
          stroke: rgba(255, 255, 255, 0.12);
        }
      }
    </style>
  </defs>
  <!-- Theme-Adaptive Squircle -->
  <rect class="bg-squircle" width="504" height="504" x="4" y="4" rx="115" stroke-width="4" />
  
  <!-- 7-Vertebrae Spine (Option 2) -->
