    <rect x="232.6" y="141.0" width="70.2" height="23.4" rx="11.7" fill="url(#spineGrad)" />
    <rect x="211.2" y="192.6" width="81.9" height="25.3" rx="12.7" fill="url(#spineGrad)" />
    <rect x="193.6" y="242.3" width="89.7" height="27.3" rx="13.7" fill="url(#spineGrad)" />
    <rect x="205.3" y="293.1" width="89.7" height="27.3" rx="13.7" fill="url(#spineGrad)" />
    <rect x="222.8" y="345.7" width="85.8" height="27.3" rx="13.7" fill="url(#spineGrad)" />
    <rect x="217.0" y="400.3" width="66.3" height="23.4" rx="11.7" fill="url(#spineGrad)" />
